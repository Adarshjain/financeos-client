name: CI

# main runs this through deploy.yml, which deploys only when it passes.
on:
  workflow_call:
  pull_request:

# A superseded run on the same branch has no value once a newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 declares engines.node >= 20.9. The README used to claim 18,
          # which cannot build this project.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from the lockfile and fails on drift, which
      # is what catches a dependency that is imported but never declared — the
      # class of problem that let four eslint packages resolve only via npm's
      # flat hoisting.
      - run: npm ci

      - run: npm run typecheck

      # Catch OpenAPI spec drift from server changes
      - run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts

      # Catch unintended changes to the public API surface
      - run: npm run check:api-surface

      - run: npm run lint

  # Unit tests are the slowest step, so they run as parallel shards.
  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # No `npm run build` here: e2e.yml builds the client with the same
  # API_BASE_URL in "Build server JAR and client", and Deploy builds with Vercel.
