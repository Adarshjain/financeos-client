name: E2E

on:
  workflow_call:
    inputs:
      server_ref:
        type: string
        default: main
        description: financeos-server ref to test against
      client_ref:
        type: string
        default: ''
        description: financeos-client ref (empty = event default)
      suite:
        type: string
        default: core
        description: core (e2e/core-specs.txt) or full
  # main runs this through deploy.yml, which deploys only when it passes.
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        type: string
        default: main
        description: financeos-server ref to test against
      suite:
        type: choice
        options: [full, core]
        default: full
        description: full suite or only e2e/core-specs.txt
  schedule:
    - cron: '30 1 * * *'

# The event is part of the group so a push to main never cancels the nightly run (or vice versa).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.server_ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refs:
    # Only for the client's own PRs. When this workflow is *called*, inputs.server_ref is always set
    # (default 'main') and must win; the caller's PR body belongs to the other repo.
    if: github.event_name == 'pull_request' && inputs.server_ref == ''
    runs-on: ubuntu-latest
    outputs:
      server_ref: ${{ steps.extract.outputs.server_ref }}
    steps:
      - id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Only ref-safe characters are accepted; the value later flows into checkout and a script.
          ref=$(echo "$PR_BODY" | grep -oE '^e2e-server-ref:[[:space:]]*[A-Za-z0-9._/-]+' | head -1 | sed -E 's/^e2e-server-ref:[[:space:]]*//' || true)
          echo "server_ref=${ref:-main}" >> "$GITHUB_OUTPUT"

  plan:
    # core: e2e/core-specs.txt in one job (PRs, merges to main, the server's CI and Deploy).
    # full: the whole suite split across parallel jobs, then one report job (nightly, manual runs).
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          FULL: ${{ github.event_name == 'schedule' || inputs.suite == 'full' }}
        run: |
          if [ "$FULL" = "true" ]; then
            # Chat runs alone (E2E_CHAT=only) because the chat UI journeys depend on the api project,
            # and a dependency always runs in full. The api project stays in one job: sharding splits
            # by test count, and its hundreds of tiny sweep tests would leave one shard nearly idle.
            matrix='[
              {"name":"api","chat":"exclude","args":"--project=api"},
              {"name":"ui-1","chat":"exclude","args":"--project=ui-desktop --project=ui-mobile --shard=1/3"},
              {"name":"ui-2","chat":"exclude","args":"--project=ui-desktop --project=ui-mobile --shard=2/3"},
              {"name":"ui-3","chat":"exclude","args":"--project=ui-desktop --project=ui-mobile --shard=3/3"},
              {"name":"chat","chat":"only","args":""}
            ]'
            echo "suite=full" >> "$GITHUB_OUTPUT"
          else
            matrix='[{"name":"core","chat":"","args":""}]'
            echo "suite=core" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [refs, plan]
    if: always() && !cancelled() && !failure()
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every nightly job runs to the end so the report shows all failures, not just the first job's.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SERVER_DIR: server
      CI: 'true'
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          # Explicit: when this workflow is *called* from financeos-server, github.repository is the
          # caller, and a bare checkout would fetch the server twice and never the client.
          repository: Adarshjain/financeos-client
          ref: ${{ inputs.client_ref }}

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: Adarshjain/financeos-server
          ref: ${{ inputs.server_ref || needs.refs.outputs.server_ref || github.event.inputs.server_ref || 'main' }}
          path: server

      - name: Print resolved refs
        env:
          CLIENT_REF: ${{ inputs.client_ref || github.ref }}
          SERVER_REF: ${{ inputs.server_ref || needs.refs.outputs.server_ref || github.event.inputs.server_ref || 'main' }}
        run: |
          echo "Client ref: $CLIENT_REF ($(git rev-parse HEAD))"
          echo "Server ref: $SERVER_REF ($(git -C server rev-parse HEAD))"
          # The nightly report job reads the commits under test from here.
          mkdir -p e2e/logs
          { echo "client_sha=$(git rev-parse HEAD)"; echo "server_sha=$(git -C server rev-parse HEAD)"; } > e2e/logs/refs.txt

      - name: Docker Hub login (optional)
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$U" ] && [ -n "$T" ]; then
            echo "$T" | docker login -u "$U" --password-stdin
          fi

      - name: Start Docker Compose (background boot)
        run: docker compose -f e2e/docker-compose.yml up -d

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build server JAR and client (in parallel)
        run: |
          mkdir -p e2e/logs
          chmod +x server/mvnw
          bash e2e/scripts/build-server.sh > e2e/logs/build-server.log 2>&1 &
          server_pid=$!
          bash e2e/scripts/build-client.sh > e2e/logs/build-client.log 2>&1 &
          client_pid=$!
          status=0
          if ! wait "$server_pid"; then echo "::error::Server JAR build failed"; tail -n 100 e2e/logs/build-server.log; status=1; fi
          if ! wait "$client_pid"; then echo "::error::Client build failed"; tail -n 100 e2e/logs/build-client.log; status=1; fi
          exit "$status"

      - name: Wait for Docker Compose services
        run: |
          docker compose -f e2e/docker-compose.yml up -d --wait
          bash e2e/scripts/check-chat-ro.sh

      - name: Start server (+ migration idempotence check) and client (in parallel)
        run: |
          # /login renders without the API, so the client does not have to wait for the server.
          (bash e2e/scripts/start-server.sh && bash e2e/scripts/start-server.sh --second-boot) > e2e/logs/start-server.out 2>&1 &
          server_pid=$!
          SKIP_CLIENT_BUILD=1 bash e2e/scripts/start-client.sh > e2e/logs/start-client.out 2>&1 &
          client_pid=$!
          status=0
          if ! wait "$server_pid"; then echo "::error::Server did not start"; status=1; fi
          cat e2e/logs/start-server.out
          if ! wait "$client_pid"; then echo "::error::Client did not start"; status=1; fi
          cat e2e/logs/start-client.out
          exit "$status"

      - name: Run Playwright E2E tests
        # core: the specs in e2e/core-specs.txt, gates skipped (they need the whole suite).
        # full (one nightly job): its slice of the suite with no retries, so a test that only passes on
        # its second attempt fails the night; it writes a blob report and its coverage for the report job.
        env:
          SUITE: ${{ needs.plan.outputs.suite }}
          E2E_RETRIES: ${{ needs.plan.outputs.suite == 'full' && '0' || '' }}
          E2E_CHAT: ${{ matrix.chat }}
          PW_ARGS: ${{ matrix.args }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/e2e/blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.name }}.zip
        run: |
          echo "E2E suite: $SUITE (${{ matrix.name }})"
          if [ "$SUITE" = "full" ]; then
            read -r -a args <<< "$PW_ARGS"
            E2E_COVERAGE_DUMP=1 npx playwright test --config e2e/playwright.config.ts --reporter=blob,list ${args[@]+"${args[@]}"}
          else
            specs=()
            while IFS= read -r spec; do specs+=("$spec"); done < <(grep -vE '^[[:space:]]*(#|$)' e2e/core-specs.txt)
            # An empty list would make Playwright run everything; fail instead.
            if [ "${#specs[@]}" -eq 0 ]; then echo "e2e/core-specs.txt lists no specs" >&2; exit 1; fi
            E2E_SKIP_GATES=1 npx playwright test --config e2e/playwright.config.ts "${specs[@]}"
          fi

      - name: Upload E2E report & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/blob-report
            e2e/logs
          retention-days: 14

      - name: Teardown E2E environment
        if: always()
        run: bash e2e/scripts/down.sh

  report:
    # Nightly / full runs only: one HTML report and junit.xml from every job, the coverage gates over
    # all jobs' coverage, and one Slack message.
    needs: [plan, e2e]
    if: always() && needs.plan.outputs.suite == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          repository: Adarshjain/financeos-client
          ref: ${{ inputs.client_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download job reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-*-${{ github.run_attempt }}
          path: jobs

      - name: Merge reports
        id: merge
        run: |
          mkdir -p e2e/all-blobs
          cp jobs/*/blob-report/*.zip e2e/all-blobs/
          npx playwright merge-reports --config e2e/playwright.merge.config.ts e2e/all-blobs

      - name: Coverage gates over all jobs
        id: gate
        if: always()
        run: npx tsx e2e/coverage/merge-gate.ts jobs/*

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-nightly-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results/junit.xml
            e2e/test-results/coverage-summary.md
          retention-days: 14

      - name: Report to Slack
        id: outcome
        if: always()
        continue-on-error: true
        env:
          # Empty when the secret is unset; slack-e2e-report.sh then warns and exits 0.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOBS_RESULT: ${{ needs.e2e.result }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          notes=()
          [ "$GATE_OUTCOME" = "success" ] || notes+=("coverage gates failed (coverage-summary.md in the nightly report)")
          [ "$MERGE_OUTCOME" = "success" ] || notes+=("reports could not be merged")
          [ "$JOBS_RESULT" = "success" ] || notes+=("a test job failed; a job that stopped early is missing from the counts")
          outcome=success
          if [ "$JOBS_RESULT" = "cancelled" ]; then outcome=cancelled
          elif [ "${#notes[@]}" -gt 0 ]; then outcome=failure
          fi
          E2E_OUTCOME="$outcome"
          E2E_NOTES="$(printf '%s\n' "${notes[@]+"${notes[@]}"}")"
          SERVER_SHA="$(grep -h '^server_sha=' jobs/*/logs/refs.txt 2>/dev/null | head -1 | cut -d= -f2 || true)"
          CLIENT_SHA="$(grep -h '^client_sha=' jobs/*/logs/refs.txt 2>/dev/null | head -1 | cut -d= -f2 || true)"
          export E2E_OUTCOME E2E_NOTES SERVER_SHA CLIENT_SHA
          .github/scripts/slack-e2e-report.sh e2e/test-results/junit.xml

      - name: Fail the run when anything failed
        if: always()
        env:
          JOBS_RESULT: ${{ needs.e2e.result }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          echo "jobs=$JOBS_RESULT merge=$MERGE_OUTCOME gates=$GATE_OUTCOME"
          [ "$JOBS_RESULT" = "success" ] && [ "$MERGE_OUTCOME" = "success" ] && [ "$GATE_OUTCOME" = "success" ]
