name: Deploy notify

# Vercel deploys the client straight from git, so there is no deploy job to hook into here.
# Instead, follow the "Vercel" commit status Vercel posts on every deploy:
# pending ("Vercel is deploying your app") -> success | failure | error.
# Only main is reported (Production); preview deploys on other branches are ignored.
on:
  status:

concurrency:
  group: deploy-notify-${{ github.event.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  notify:
    if: >-
      github.event.context == 'Vercel' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack
        env:
          # Empty when the secret is unset; slack-notify.sh then warns and exits 0.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_COMPONENT: Client
          STATE: ${{ github.event.state }}
          DEPLOY_SHA: ${{ github.event.sha }}
          DEPLOY_SUBJECT: ${{ github.event.commit.commit.message }}
          DEPLOY_ACTOR: ${{ github.event.commit.author.login || github.event.commit.commit.author.name }}
          DEPLOY_LINK_URL: ${{ github.event.target_url }}
          DEPLOY_LINK_LABEL: view on Vercel
          DEPLOY_FAILURE_HINT: Production still serves the previous deployment; it can be promoted back from the Vercel dashboard.
        run: |
          case "$STATE" in
            pending)       status=started ;;
            success)       status=success ;;
            failure|error) status=failure ;;
            *) echo "Ignoring Vercel status '$STATE'."; exit 0 ;;
          esac
          if [ "$status" != "started" ]; then
            # Duration runs from the latest "pending" Vercel status on this commit (newest first).
            started_at=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/statuses" \
              --jq '[.[] | select(.context == "Vercel" and .state == "pending")][0].created_at // empty' || true)
            if [ -n "$started_at" ]; then
              export DEPLOY_START_TS=$(date -d "$started_at" +%s)
            fi
          fi
          .github/scripts/slack-notify.sh "$status"
