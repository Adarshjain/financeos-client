services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: financeos-e2e-oracle
    ports: ["1522:1521"]
    environment:
      ORACLE_PASSWORD: E2eOracle123
      APP_USER: FINANCEOS
      APP_USER_PASSWORD: E2eApp12345
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: financeos-e2e-wiremock
    ports: ["8089:8080"]
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./stubs/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      retries: 20
