<!-- @dsCard height=288 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:288px;background:var(--bg-surface);overflow:hidden;font-family:var(--font-text)}
.cv svg{position:absolute;left:0;top:0}
.brand{fill:var(--brand)}.ink{fill:var(--ink)}.tint{fill:var(--brand-tint)}.amber{fill:var(--warning)}.gold{fill:var(--illus-gold)}
.rx{rx:var(--radius-xl)}.rl{rx:var(--radius-lg)}
.nm{position:absolute;left:40px;bottom:40px;max-width:440px}
.nm h1{margin:0;font:800 80px/0.92 var(--font-display);letter-spacing:-0.03em;color:var(--ink)}
.nm p{margin:12px 0 0;font:500 14px/20px var(--font-text);color:var(--ink-3)}
</style>
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: brand 208x248 slab, ink 256x120, brand-tint 120x148, warning 80x56 (radius-xl / radius-lg)
     arrangement: one tall brand slab bleeding off the top with three satellites stepping right, the ink block bleeding off the right edge
     pattern: literal motif, the gold rupee coin from the auth and offline illustrations, as a 6x3 grid of discs on the ink block
     scales: disc pitch space-32, disc radius 10, gaps space-16, corners radius-xl and radius-lg -->
<rect class="brand rx" x="500" y="-20" width="208" height="248"/>
<rect class="ink rx" x="724" y="24" width="256" height="120"/>
<rect class="tint rx" x="724" y="160" width="120" height="148"/>
<rect class="amber rl" x="860" y="160" width="80" height="56"/>
<circle class="gold" cx="752" cy="52" r="10"/><circle class="gold" cx="784" cy="52" r="10"/><circle class="gold" cx="816" cy="52" r="10"/><circle class="gold" cx="848" cy="52" r="10"/><circle class="gold" cx="880" cy="52" r="10"/><circle class="gold" cx="912" cy="52" r="10"/><circle class="gold" cx="752" cy="84" r="10"/><circle class="gold" cx="784" cy="84" r="10"/><circle class="gold" cx="816" cy="84" r="10"/><circle class="gold" cx="848" cy="84" r="10"/><circle class="gold" cx="880" cy="84" r="10"/><circle class="gold" cx="912" cy="84" r="10"/><circle class="gold" cx="752" cy="116" r="10"/><circle class="gold" cx="784" cy="116" r="10"/><circle class="gold" cx="816" cy="116" r="10"/><circle class="gold" cx="848" cy="116" r="10"/><circle class="gold" cx="880" cy="116" r="10"/><circle class="gold" cx="912" cy="116" r="10"/>
</svg>
<div class="nm"><h1>FinanceOS</h1><p>Calm, dense money screens for India, built phone first.</p></div>
</div>
